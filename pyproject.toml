[project]
name = "multi-agent-ecommerce-dispute-resolution"
version = "0.1.0"
description = "Multi-agent Olist dispute resolution pipeline for EC_POLICY_V2"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "huggingface-hub>=0.31,<2",
    "langgraph>=0.4,<2",
    "numpy>=1.26,<3",
    "openai>=2,<3",
    "pydantic>=2.7,<3",
    "python-dotenv>=1.0,<2",
    "rank-bm25>=0.2.2,<0.3",
    "scikit-learn>=1.4,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
